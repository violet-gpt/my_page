<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Системное уведомление</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }

        /* Черный экран */
        #screen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 0 10px;
        }

        /* Эффект помех (шум) через SVG + анимацию */
        #noise {
            position: absolute;
            inset: 0;
            opacity: 0.15;
            pointer-events: none;
            z-index: 11;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
            animation: noiseAnim 0.2s steps(3) infinite;
        }

        @keyframes noiseAnim {
            0%   { transform: translate(0, 0); }
            25%  { transform: translate(-5%, -5%); }
            50%  { transform: translate(5%, 3%); }
            75%  { transform: translate(-3%, 5%); }
            100% { transform: translate(4%, -4%); }
        }

        /* Полосы как на старом ТВ */
        #scanlines {
            position: absolute;
            inset: 0;
            z-index: 12;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0) 0px,
                rgba(0, 0, 0, 0) 2px,
                rgba(255, 255, 255, 0.03) 3px,
                rgba(0, 0, 0, 0) 4px
            );
        }

        /* Мигающая красная рамка */
        #border {
            position: absolute;
            inset: 20px;
            border: 2px solid rgba(255, 0, 0, 0.4);
            z-index: 13;
            pointer-events: none;
            animation: borderBlink 1s infinite;
        }

        @keyframes borderBlink {
            0%, 100% { opacity: 0.2; }
            50%      { opacity: 0.8; }
        }

        /* Главный текст */
        #warning {
            position: relative;
            z-index: 15;
            color: #ff0000;
            font-size: clamp(18px, 5vw, 48px);
            font-weight: bold;
            text-align: center;
            padding: 0 10px;
            letter-spacing: 2px;
            line-height: 1.3;
            text-shadow:
                0 0 10px #ff0000,
                0 0 20px #ff0000,
                0 0 40px #ff0000;
            animation: flicker 0.15s infinite, pulse 1s infinite;
            user-select: none;
            word-wrap: break-word;
            max-width: 100%;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0.85; }
            10%      { opacity: 0.7; }
            30%      { opacity: 1; }
            70%      { opacity: 0.9; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50%      { transform: scale(1.02); }
        }

        /* Вторая надпись */
        #joke {
            position: fixed;
            bottom: 130px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            z-index: 20;
            color: #00ff00;
            font-size: clamp(13px, 3.5vw, 24px);
            text-align: center;
            padding: 10px 15px;
            text-shadow:
                0 0 8px #00ff00,
                0 0 16px #00ff00;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease, transform 0.8s ease;
            user-select: none;
            width: 95%;
            max-width: 700px;
            line-height: 1.3;
            word-wrap: break-word;
        }

        #joke.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Третья надпись — по центру под второй */
        #warning-note {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            z-index: 21;
            text-align: center;
            opacity: 0;
            transition: opacity 0.8s ease, transform 0.8s ease;
            pointer-events: none;
            user-select: none;
            width: 95%;
            max-width: 700px;
            padding: 0 10px;
        }

        #warning-note.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        #warning-note .phrase {
            color: #ffcc00;
            font-size: clamp(13px, 3vw, 20px);
            text-shadow:
                0 0 8px #ffcc00,
                0 0 16px #ffaa00;
            font-style: italic;
            line-height: 1.3;
            word-wrap: break-word;
        }

        #warning-note .signature {
            margin-top: 6px;
            color: #ffcc00;
            font-size: clamp(12px, 2.8vw, 18px);
            text-shadow:
                0 0 6px #ffcc00,
                0 0 12px #ffaa00;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="screen">
        <div id="noise"></div>
        <div id="scanlines"></div>
        <div id="border"></div>
        <div id="warning">на ваше устройство скачан вирус</div>
    </div>

    <div id="joke">ну что, будете еще переходить по непроверенным ссылкам?)))</div>

    <div id="warning-note">
        <div class="phrase">я же вас предупреждала</div>
        <div class="signature">— А.Н.</div>
    </div>

    <script>
        // Показываем первую шутку через 5 секунд
        setTimeout(() => {
            document.getElementById('joke').classList.add('show');
        }, 5000);

        // Показываем вторую надпись ещё через 2 секунды (итого через 7 сек)
        setTimeout(() => {
            document.getElementById('warning-note').classList.add('show');
        }, 7000);
    </script>

</body>
</html>
